# Runs the Firestore security-rules tests (firebase/test) on the local emulator whenever the rules change.
name: Firestore rules

on:
  pull_request:
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firestore-rules.yml']
  push:
    branches: [main]
    paths: ['firebase/**', 'firebase.json']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
        working-directory: firebase
      - run: npm install -g firebase-tools@15
      - run: npm test
        working-directory: firebase
